name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-linux:
    runs-on: ubuntu-latest
    env:
      BIN_NAME: vigrep
      TARGET_TRIPLE: x86_64-unknown-linux-gnu
      ARCHIVE_NAME: vigrep-linux-x86_64.tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET_TRIPLE }}

      - name: Build release binary
        run: cargo build --locked --release --target "${TARGET_TRIPLE}"

      - name: Package release archive
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${TARGET_TRIPLE}/release/${BIN_NAME}" "dist/${BIN_NAME}"
          tar -C dist -czf "dist/${ARCHIVE_NAME}" "${BIN_NAME}"
          (cd dist && sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256")

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/vigrep-linux-x86_64.tar.gz
            dist/vigrep-linux-x86_64.tar.gz.sha256
